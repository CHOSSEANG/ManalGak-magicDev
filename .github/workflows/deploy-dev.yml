name: 개발 서버 배포
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # 백엔드 빌드 및 Docker 이미지
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      backend-image-tag: ${{ steps.meta.outputs.tags }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build backend JAR
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=backend-

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 프론트엔드 빌드 및 Docker 이미지
  build-frontend:
      runs-on: ubuntu-latest
      outputs:
        frontend-image-tag: ${{ steps.meta.outputs.tags }}
      defaults:
        run:
          working-directory: ./frontend
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Build Next.js application
          run: npm run build
          env:
            NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.DEV_KAKAO_REDIRECT_URI }}
            NEXT_PUBLIC_KAKAO_REST_API_KEY: ${{ secrets.DEV_NEXT_PUBLIC_KAKAO_REST_API_KEY}}
            NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.DEV_NEXT_PUBLIC_KAKAO_JS_KEY}}
            NEXT_PUBLIC_API_BASE_URL: ${{ secrets.DEV_NEXT_PUBLIC_API_BASE_URL}}
            NEXT_PUBLIC_OPENWEATHER_API_KEY: ${{secrets.DEV_OPENWEATHER_API_KEY}}


        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Extract metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
            tags: |
              type=ref,event=branch
              type=sha,prefix=frontend-

        - name: Log in to Container Registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push frontend image
          uses: docker/build-push-action@v5
          with:
            context: ./frontend
            file: ./frontend/Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

  # Docker Compose로 배포
  deploy:
    needs: [ build-backend, build-frontend ]
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Get GitHub Actions IP
        id: ip
        uses: haythem/public-ip@v1.2

      # AWS cli 접근을 위한 AWS 설정 추가
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # IAM user access_key_id
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # IAM user secret_access_key
          aws-region: ap-northeast-1

      # AWS EC2에 접근하기 위해 보안그룹에 github ip 추가
      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
          --protocol tcp --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
          set -e

          # 프로젝트 디렉토리로 이동
          cd ~/manalgak

          echo "📦 Pulling latest changes from develop branch..."
          git pull origin develop

          RAW_BACKEND_TAG="${{ needs.build-backend.outputs.backend-image-tag }}"
          RAW_FRONTEND_TAG="${{ needs.build-frontend.outputs.frontend-image-tag }}"

          BACKEND_TAG=$(echo "$RAW_BACKEND_TAG" | head -n 1)
          FRONTEND_TAG=$(echo "$RAW_FRONTEND_TAG" | head -n 1)

          # 2. 루트 .env 생성 (Docker Compose의 변수 치환용)
          cat > .env << EOL
          BACKEND_IMAGE=$BACKEND_TAG
          FRONTEND_IMAGE=$FRONTEND_TAG
          EOL

          echo "📦 생성: 백엔드 환경 변수 파일 (./backend/.env)"
          cat > ./backend/.env << EOL
          # Docker 이미지 태그 및 설정
          SPRING_PROFILES_ACTIVE=dev
          DB_HOST=${{ secrets.DB_DEV_HOST }}
          DB_USERNAME=${{ secrets.DB_DEV_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_DEV_PASSWORD }}

          KAKAO_API_KEY=${{ secrets.DEV_KAKAO_API_KEY }}
          KAKAO_CLIENT_SECRET=${{ secrets.DEV_KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI=${{ secrets.DEV_KAKAO_REDIRECT_URI }}

          FRONTEND_LOGIN_SUCCESS_URL=${{ secrets.DEV_FRONTEND_LOGIN_SUCCESS_URL }}
          FRONTEND_BASE_URL=${{ secrets.DEV_FRONTEND_BASE_URL }}

          ODSAY_API_KEY=${{secrets.DEV_ODSAY_API_KEY}}
          OPEN_API_KEY=${{secrets.DEV_OPEN_API_KEY}}
          OPENWEATHER_API_KEY=${{secrets.DEV_OPENWEATHER_API_KEY}}

          JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}

          NEXT_PUBLIC_API_URL=${{secrets.DEV_NEXT_PUBLIC_API_URL}}

          REDIS_HOST=${{secrets.DEV_REDIS_HOST}}
          REDIS_PORT=${{secrets.DEV_REDIS_PORT}}
          EOL

          echo "🐳 Docker login to GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "🛑 Stopping existing containers..."
          sudo docker-compose -f docker-compose.dev.yml down

          echo "📦 Pulling new images..."
          sudo docker-compose -f docker-compose.dev.yml pull

          echo "🚀 Starting services..."
          sudo docker-compose -f docker-compose.dev.yml up -d

          echo "⏳ Waiting for services to be healthy..."
          sleep 20

          echo "📊 Service status:"
          sudo docker-compose -f docker-compose.dev.yml ps

          echo "📝 Recent logs:"
          sudo docker-compose -f docker-compose.dev.yml logs --tail=20

          echo "🧹 Cleaning up unused images..."
          sudo docker image prune -f

          echo "✅ Deployment completed successfully!"
          echo "🔗 Application is running at: http://${{ secrets.DEV_SERVER_HOST }}"
          EOF

      # 보안 그룹에 추가한 github IP 제거
      - name: Remove Github Actions IP from Security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        continue-on-error: true  # 👈 이것도 추가 권장 (이미 제거됐어도 에러 무시)

